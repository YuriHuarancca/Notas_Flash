<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget de Notas Windows 11</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="theme-dark-mica">
  <div class="widget-container" id="widgetContainer">
    <!-- Native-style Window Border Resize Handles (8 directions) -->
    <div class="resize-handle resize-top" data-direction="top"></div>
    <div class="resize-handle resize-bottom" data-direction="bottom"></div>
    <div class="resize-handle resize-left" data-direction="left"></div>
    <div class="resize-handle resize-right" data-direction="right"></div>
    <div class="resize-handle resize-top-left" data-direction="top-left"></div>
    <div class="resize-handle resize-top-right" data-direction="top-right"></div>
    <div class="resize-handle resize-bottom-left" data-direction="bottom-left"></div>
    <div class="resize-handle resize-bottom-right" data-direction="bottom-right"></div>

    <!-- Header / Drag Bar -->
    <header class="widget-header" id="widgetHeader" ondragstart="return false;">
      <div class="header-left">
        <div class="app-icon" title="Arrastrar para mover widget">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="5 9 2 12 5 15"></polyline>
            <polyline points="9 5 12 2 15 5"></polyline>
            <polyline points="15 19 12 22 9 19"></polyline>
            <polyline points="19 9 22 12 19 15"></polyline>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="12" y1="2" x2="12" y2="22"></line>
          </svg>
        </div>
        <span class="widget-title" id="widgetTitle" contenteditable="false" title="Arrastrar para mover widget">--/-- · --:--</span>
      </div>

      <div class="header-actions">
        <!-- Pin Button (Always On Top Toggle) -->
        <button class="win-btn pin-btn" id="btnPin" title="Anclar siempre visible (Always on Top)">

          <span class="pin-badge" id="pinBadge">Fijado</span>
        </button>

        <!-- Compact Mode Toggle -->
        <button class="win-btn action-icon-btn" id="btnCompact" title="Modo compacto / desplegar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>

        <!-- Minimize Window -->
        <button class="win-btn action-icon-btn" id="btnMinimize" title="Minimizar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <!-- Close / Hide Window -->
        <button class="win-btn action-icon-btn btn-close" id="btnClose" title="Cerrar widget">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Formatting Toolbar -->
    <nav class="widget-toolbar" id="widgetToolbar">
      <!-- List Tools -->
      <div class="toolbar-group">
        <button class="tool-btn" id="btnBulletList" title="Lista simple con viñetas (Ctrl+Shift+8)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <circle cx="4" cy="6" r="1.5" fill="currentColor"></circle>
            <circle cx="4" cy="12" r="1.5" fill="currentColor"></circle>
            <circle cx="4" cy="18" r="1.5" fill="currentColor"></circle>
          </svg>
        </button>

        <button class="tool-btn" id="btnNumberedList" title="Lista numerada (Ctrl+Shift+7)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="10" y1="6" x2="21" y2="6"></line>
            <line x1="10" y1="12" x2="21" y2="12"></line>
            <line x1="10" y1="18" x2="21" y2="18"></line>
            <path d="M4 8V4h2"></path>
            <path d="M4 14a2 2 0 1 0 2-2 2 2 0 0 0-2 2h2"></path>
          </svg>
        </button>

        <button class="tool-btn" id="btnChecklist" title="Lista de tareas con casilla interactiva">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Text Styles -->
      <div class="toolbar-group">
        <button class="tool-btn mini" id="btnBold" title="Negrita (Ctrl+B)">
          <strong>B</strong>
        </button>
        <button class="tool-btn mini" id="btnItalic" title="Cursiva (Ctrl+I)">
          <em>I</em>
        </button>
        <button class="tool-btn mini" id="btnUnderline" title="Subrayado (Ctrl+U)">
          <u>U</u>
        </button>
        <button class="tool-btn mini" id="btnStrike" title="Tachado">
          <s>S</s>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Quick Formats & Actions -->
      <div class="toolbar-group">
        <button class="tool-btn mini" id="btnHeading" title="Encabezado (Ctrl+H)">
          <span style="font-weight: 700; font-size: 14.5px;">H</span>
        </button>
        <button class="tool-btn mini" id="btnFontSizeDown" title="Reducir fuente">A-</button>
        <button class="tool-btn mini" id="btnFontSizeUp" title="Aumentar fuente">A+</button>
      </div>

    </nav>

    <!-- Theme Popup Menu -->
    <div class="theme-popup" id="themePopup" style="display: none;">
      <div class="theme-popup-header">Elige un estilo de Windows 11:</div>
      <div class="theme-options">
        <button class="theme-swatch swatch-dark" data-theme="theme-dark-mica" title="Windows 11 Mica Oscuro">
          <span class="swatch-preview"></span>
          <span>Mica Oscuro</span>
        </button>
        <button class="theme-swatch swatch-light" data-theme="theme-light-mica" title="Windows 11 Mica Claro">
          <span class="swatch-preview"></span>
          <span>Mica Claro</span>
        </button>
        <button class="theme-swatch swatch-sticky" data-theme="theme-sticky-yellow" title="Sticky Note Clásico">
          <span class="swatch-preview"></span>
          <span>Amarillo Nota</span>
        </button>
        <button class="theme-swatch swatch-cyber" data-theme="theme-cyber-blue" title="Azul Eléctrico">
          <span class="swatch-preview"></span>
          <span>Cíber Azul</span>
        </button>
        <button class="theme-swatch swatch-sage" data-theme="theme-sage-green" title="Verde Salvia Nórdico">
          <span class="swatch-preview"></span>
          <span>Verde Salvia</span>
        </button>
        <button class="theme-swatch swatch-purple" data-theme="theme-purple-acrylic" title="Lavanda Acrílico">
          <span class="swatch-preview"></span>
          <span>Lavanda</span>
        </button>
      </div>
    </div>

    <!-- Main Editor -->
    <main class="editor-container" id="editorContainer">
      <div class="note-editor" id="noteEditor" contenteditable="true" spellcheck="true"
        placeholder="Escribe tus notas, tareas o recordatorios aquí...">
      </div>
    </main>

    <!-- Footer Bar -->
    <footer class="widget-footer" id="widgetFooter">
      <div class="footer-left">
        <!-- Word count only -->
        <span class="stat-words" id="statWords">0 palabras</span>

        <div class="footer-divider"></div>

        <!-- Moved buttons: Abrir, Exportar, Cambiar tema, Vaciar contenido -->
        <div class="footer-btn-group">
          <button class="footer-tool-btn" id="btnImport" title="Abrir nota guardada (Ctrl+O)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>

          <button class="footer-tool-btn" id="btnExport" title="Guardar nota como archivo (Ctrl+S)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>

          <button class="footer-tool-btn mini" id="btnPalette" title="Cambiar tema de color">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a4.5 4.5 0 0 0 0 9 4.5 4.5 0 0 1 0 9"></path>
            </svg>
          </button>

          <button class="footer-tool-btn mini" id="btnClear" title="Vaciar contenido">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="footer-right">
        <!-- Opacity with Icon instead of text -->
        <div class="opacity-control" title="Transparencia del fondo">
          <svg class="opacity-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path>
          </svg>
          <select id="selectOpacity" class="win-select" title="Opacidad del widget">
            <option value="1.0">100%</option>
            <option value="0.95" selected>95%</option>
            <option value="0.85">85%</option>
            <option value="0.75">75%</option>
          </select>
        </div>

        <!-- Drag Corner Resize Grip -->
        <div class="resize-grip" id="resizeGrip" title="Arrastra para cambiar el tamaño del widget">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
            <circle cx="13" cy="13" r="1.5"></circle>
            <circle cx="8" cy="13" r="1.5"></circle>
            <circle cx="13" cy="8" r="1.5"></circle>
            <circle cx="3" cy="13" r="1.5"></circle>
            <circle cx="8" cy="8" r="1.5"></circle>
            <circle cx="13" cy="3" r="1.5"></circle>
          </svg>
        </div>
      </div>
    </footer>

    <!-- Floating Notification Toast -->
    <div class="floating-toast" id="floatingToast"></div>

    <!-- Modal Confirmar Guardar al Cerrar -->
    <div class="modal-backdrop" id="modalUnsaved" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-icon-alert">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
        </div>
        <div class="modal-content">
          <h3 class="modal-title">¿Guardar cambios antes de salir?</h3>
          <p class="modal-desc">Tienes cambios en la nota que aún no has exportado a un archivo externo (.html). ¿Deseas
            guardarla para no perder tu trabajo?</p>
          <div class="modal-actions">
            <button class="win-btn modal-btn primary" id="btnModalSave">Guardar archivo (.html)</button>
            <button class="win-btn modal-btn secondary" id="btnModalDiscard">Salir sin guardar</button>
            <button class="win-btn modal-btn cancel" id="btnModalCancel">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
